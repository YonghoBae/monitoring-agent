    playbook: {description: "관측 및 원인 분석만 허용", category: READ_ONLY, command: null}
    situation: "nginx reload during certbot renewal dropped long-lived websocket connections; clients reconnected within a minute."
    mocks:
      verify: {status: CONFIRMED, value: "41", activeAt: "2026-08-14T04:00:00Z"}
      rag:
        - {text: "nginx reload는 keepalive/ws 커넥션을 종료함. certbot 갱신 직후 ws 단절 스파이크는 알려진 패턴.", type: "analysis", outcome: "known-pattern"}
      metrics: [websocket_active_connections, nginx_http_requests_total]
      prometheus:
        - {keyword: websocket, response: "websocket_active_connections: 41 → 0 (04:00:05) → 39 (04:01:12 재연결 완료)"}
      loki:
