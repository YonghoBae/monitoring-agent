version: 3
description: SYNTHETIC numeric operational benchmark. Constructed fixtures, not measured production telemetry; no
  real-world outcome claims. Historical v2 remains immutable.
provenance:
  kind: synthetic
  source: eval-dataset-v2.yml and all-38 research audit, 2026-11-03
  measurement_status: not measured
  interpolation: linear between knots; minute-grid samples generated by replay; no extrapolation before first or
    after last knot
  evaluation_policy: Observed facts and justified uncertainty; read-only recommendations; no universal root cause
    requirement.
default_containers:
- monitoring-agent-app
- monitoring-agent-db
- nginx
- leafy-api
- mysql
- redis
- jellyfin
- ollama
- prometheus
- loki
- grafana
- alertmanager
- worker
- couchdb
- certbot
- dcgm-exporter
- promtail
- code-server
scenarios:
- id: cpu_sustained_high
