      - - -3600
        - 10000
      - - 0
        - 10288.0
    - metric: node_cpu_seconds_total
      labels:
        instance: node-1
        cpu: '2'
        mode: user
      samples:
      - - -3600
        - 10000
      - - 0
        - 13312.0
    - metric: node_cpu_seconds_total
      labels:
        instance: node-1
        cpu: '3'
        mode: idle
      samples:
      - - -3600
        - 10000
      - - 0
        - 10288.0
    - metric: node_cpu_seconds_total
      labels:
        instance: node-1
        cpu: '3'
        mode: user
      samples:
      - - -3600
        - 10000
      - - 0
        - 13312.0
    logs:
    - source: docker
      name: worker
      entries:
      - offset_seconds: -180
        line: 'worker | INFO batch job running: reindex-media (started 09:02)'
    containers:
    - monitoring-agent-app
    - monitoring-agent-db
    - nginx
    - leafy-api
    - mysql
    - redis
    - jellyfin
    - ollama
    - prometheus
    - loki
    - grafana
    - alertmanager
    - worker
    - couchdb
    - certbot
    - dcgm-exporter
    - promtail
    - code-server
    verify:
      status: CONFIRMED
      activeAt: '2026-08-15T11:30:00Z'
      value: 6.4
    rag:
    - text: '2026-05 HostHighCpuLoad node-1: jellyfin 트랜스코딩 급증이 원인. 작업 종료 후 정상화.'
      type: resolution
      outcome: resolved
    declared_metrics:
    - node_cpu_seconds_total
    - node_load1
    - node_load5
    - node_procs_running
  expected:
    required_facts:
    - id: sustained_cpu
      description: Four CPU cores have sustained approximately 92% non-idle use; load5 rises to 6.4 and runnable
        processes reach 14.
      evidence:
      - metric:node_cpu_seconds_total
      - metric:node_load5
      - metric:node_procs_running
    - id: batch_observed
      description: Worker logs show a running media reindex batch; this is a plausible contributor, not proved exclusive
        cause.
      evidence:
