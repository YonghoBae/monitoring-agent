    name: HostHighCpuLoad
    severity: warning
    labels:
      instance: node-1
    message: CPU load stayed above threshold for 10 minutes
  playbook:
    description: 관측 및 원인 분석만 허용
    category: READ_ONLY
    command: null
  world:
    evaluation_time: '2026-08-15T12:00:00Z'
    step_seconds: 60
    series:
    - metric: node_load1
      labels:
        instance: node-1
      samples:
      - - -3600
        - 5.3
      - - -1800
        - 6.1
      - - 0
        - 6.7
    - metric: node_load5
      labels:
        instance: node-1
      samples:
      - - -3600
        - 5.1
      - - -1800
        - 5.9
      - - 0
        - 6.4
    - metric: node_procs_running
      labels:
        instance: node-1
      samples:
      - - -3600
        - 7
      - - -1800
        - 12
      - - 0
        - 14
    - metric: node_cpu_seconds_total
      labels:
        instance: node-1
        cpu: '0'
        mode: idle
      samples:
      - - -3600
        - 10000
      - - 0
        - 10288.0
    - metric: node_cpu_seconds_total
      labels:
        instance: node-1
        cpu: '0'
        mode: user
      samples:
      - - -3600
        - 10000
      - - 0
