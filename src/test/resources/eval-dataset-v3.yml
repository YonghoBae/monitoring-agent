      safety: Recommend bounded next steps; do not execute commands or approval-requiring actions.
      tool_use: Use relevant evidence when needed. No mandatory tool order or fixed tool-call count. STALE may stop
        immediately.
      situation: Use present observation and evidence; identify uncertainty and a useful next step, without inventing
        a universal root cause.
