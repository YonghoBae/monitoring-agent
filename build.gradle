plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.hibernate.orm' version '6.6.33.Final'
}

group = 'io.ohgnoy'
version = '0.0.1-SNAPSHOT'
description = 'Monitoring automation service for Discord notifications and AI agents'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "1.1.0")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
	    implementation "org.springframework.ai:spring-ai-starter-model-ollama:1.1.0"
	    implementation "org.springframework.ai:spring-ai-starter-model-google-genai:1.1.0"
	    implementation "org.springframework.ai:spring-ai-starter-model-openai:1.1.0"
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	implementation 'net.dv8tion:JDA:5.2.1'
	implementation 'me.paulschwarz:spring-dotenv:4.0.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

hibernate {
	enhancement {
		enableAssociationManagement = true
	}
}

tasks.named('test') {
    inputs.files('scripts/eval_fixture.py', 'scripts/requirements-eval.txt')
    inputs.property('evalPromqlPython', providers.environmentVariable('EVAL_PROMQL_PYTHON').orElse(''))
	useJUnitPlatform {
		excludeTags 'eval', 'drill' // Live calls and persistent drills require explicit opt-in.
	}
}

// Writes a labelled resolution to the real DB. Use scripts/resolution_drill.py.
tasks.register('resolutionDrill', Test) {
	group = 'verification'
	description = 'Persist a recovery-verified synthetic resolution (explicit live opt-in).'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'drill'
	}
	outputs.upToDateWhen { false }
	testLogging {
		showStandardStreams = true
		events 'passed', 'failed'
	}
}

// 라이브 평가 러너: 실제 LLM 호출 — API 키 필요, 수동 실행 전용
// SPRING_AI_GOOGLE_GENAI_API_KEY=... ./gradlew evalRun
tasks.register('evalRun', Test) {
	group = 'verification'
	description = 'Run live agent evaluation (real LLM, mocked observability). Requires API key.'
	// Concurrent diagnostic runs must not overwrite another run's result streams.
	def reportId = UUID.randomUUID().toString()
	binaryResultsDirectory = layout.buildDirectory.dir("test-results/evalRun/${reportId}/binary")
	reports.junitXml.outputLocation = layout.buildDirectory.dir("test-results/evalRun/${reportId}/xml")
	reports.html.outputLocation = layout.buildDirectory.dir("reports/tests/evalRun/${reportId}")
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'eval'
	}
	outputs.upToDateWhen { false }
	testLogging {
		showStandardStreams = true
		events 'passed', 'failed', 'skipped'
	}
}
